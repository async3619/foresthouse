name: Policy

on:
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - main
      - dev

concurrency:
  group: policy-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  commitlint:
    name: commitlint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 10.32.1

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Lint pull request commits
        if: github.event_name == 'pull_request'
        run: npx commitlint --from "${{ github.event.pull_request.base.sha }}" --to "${{ github.event.pull_request.head.sha }}" --verbose

      - name: Lint pushed commits
        if: github.event_name == 'push'
        run: |
          BEFORE="${{ github.event.before }}"
          AFTER="${{ github.sha }}"

          if [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            BEFORE="$(git rev-list --max-parents=0 "$AFTER")"
          fi

          npx commitlint --from "$BEFORE" --to "$AFTER" --verbose

  pr-policy:
    name: pr-policy
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Validate pull request policy
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_BASE: ${{ github.base_ref }}
          PR_HEAD: ${{ github.head_ref }}
        run: |
          node --input-type=module <<'EOF'
          const errors = [];
          const body = process.env.PR_BODY ?? '';
          const base = process.env.PR_BASE ?? '';
          const head = process.env.PR_HEAD ?? '';

          if (base === 'main' && head !== 'dev') {
            errors.push('Only `dev` can be merged into `main`.');
          }

          if (base === 'dev' && !/^codex\/issue-\d+-[a-z0-9-]+$/.test(head)) {
            errors.push(
              'Pull requests into `dev` must come from a branch named `codex/issue-<number>-<slug>`.',
            );
          }

          if (!/(Closes|Fixes|Refs)\s+#\d+/i.test(body)) {
            errors.push(
              'Pull request body must reference a GitHub issue with `Closes #<number>`, `Fixes #<number>`, or `Refs #<number>`.',
            );
          }

          if (errors.length > 0) {
            for (const error of errors) {
              console.error(`- ${error}`);
            }

            process.exit(1);
          }
          EOF
